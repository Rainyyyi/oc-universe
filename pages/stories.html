<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>故事列表 - OC宇宙</title>
  <!-- 主题初始化（必须最靠前） -->
  <script>
    try { var t = localStorage.getItem('oc_theme') || 'light'; document.documentElement.setAttribute('data-theme', t); } catch(e) {}
  </script>
  <!-- 关键主题色 & 暗色变量（必须内联，防止闪白） -->
  <style>
    html, body { background-color: #FFFFFF; }
    html[data-theme="dark"], html[data-theme="dark"] body { background-color: #070B14; }
    html[data-theme="dark"] { --primary-color: #60A5FA; --primary-hover: #93C5FD; --bg-primary: #070B14; --bg-secondary: #0D1424; --bg-tertiary: #111827; --bg-card: #0D1424; --bg-sidebar: #090E1A; --text-primary: #E2E8F0; --text-secondary: #94A3B8; --text-muted: #64748B; --text-inverse: #FFFFFF; --border-color: #1E2D4A; --border-light: #243354; }
  </style>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/dark-mode.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- Google Fonts -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <!-- Appwrite Web SDK -->
  <script defer src="https://cdn.jsdelivr.net/npm/appwrite@17/dist/iife/sdk.min.js"></script>
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <button class="navbar-toggle btn-ghost btn-icon" id="sidebarToggle">
      <i data-lucide="Menu"></i>
    </button>
    <a href="../index.html" class="navbar-brand">
      <span class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.5"/>
          <ellipse cx="12" cy="12" rx="9" ry="2.5" stroke="currentColor" stroke-width="1" transform="rotate(-25 12 12)"/>
          <circle cx="19" cy="7" r="1.5" fill="currentColor" opacity="0.8"/>
        </svg>
      </span>
      <span>OC宇宙</span>
    </a>
    <div class="navbar-menu">
      <a href="../index.html">世界观</a>
      <a href="characters.html">角色</a>
      <a href="stories.html" class="active">故事</a>
      <a href="chat.html">AI聊天</a>
      <a href="relationship-map.html">关系图谱</a>
    </div>
    <div class="navbar-actions">
      <button class="theme-toggle" id="themeToggle" title="切换主题">
        <i data-lucide="Moon" class="icon-moon"></i>
        <i data-lucide="Sun" class="icon-sun"></i>
      </button>
      <a href="admin.html" class="btn btn-primary btn-sm">
        <i data-lucide="Settings"></i>
        <span>管理后台</span>
      </a>
    </div>
  </nav>

  <!-- 侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="form-group" style="margin-bottom: 0;">
        <input type="text" class="form-input" placeholder="搜索故事..." id="searchStory">
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="stories.html" class="sidebar-nav-item active">
        <span class="icon"><i data-lucide="BookOpen"></i></span>
        <span>全部故事</span>
      </a>
      <a href="#" class="sidebar-nav-item" onclick="filterStories('writing')">
        <span class="icon"><i data-lucide="PenTool"></i></span>
        <span>写作中</span>
      </a>
      <a href="#" class="sidebar-nav-item" onclick="filterStories('completed')">
        <span class="icon"><i data-lucide="CheckCircle"></i></span>
        <span>已完成</span>
      </a>
      <a href="#" class="sidebar-nav-item" onclick="filterStories('draft')">
        <span class="icon"><i data-lucide="FileEdit"></i></span>
        <span>草稿</span>
      </a>
    </nav>
    <div class="sidebar-section">
      <div class="sidebar-section-title">按世界观筛选</div>
      <div id="worldFilterList">
        <div class="empty-state" style="padding: var(--spacing-md); text-align: center; color: var(--text-muted); font-size: 0.875rem;">
          <p>暂无世界观</p>
        </div>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-title">灵感碎片</div>
      <a href="#" class="sidebar-nav-item" onclick="showInspirationModal()">
        <span class="icon"><i data-lucide="Lightbulb"></i></span>
        <span>未整理灵感</span>
        <span class="tag tag-warning" style="margin-left: auto;">0</span>
      </a>
    </div>
  </aside>

  <!-- 主内容区 -->
  <main class="main-content">
    <!-- 页面头部 -->
    <header class="page-header">
      <div class="page-title">
        <h1>故事列表</h1>
        <div class="breadcrumb">
          <a href="../index.html">首页</a>
          <span class="separator">/</span>
          <span>故事列表</span>
        </div>
      </div>
      <div class="page-actions">
        <button class="btn btn-secondary" onclick="showInspirationModal()">
          <i data-lucide="Lightbulb"></i>
          <span>灵感碎片</span>
        </button>
        <button class="btn btn-primary" onclick="showCreateStoryModal()">
          <i data-lucide="Plus"></i>
          <span>创建新故事</span>
        </button>
      </div>
    </header>

    <!-- 统计卡片 -->
    <section style="margin-bottom: var(--spacing-xl);">
      <div class="grid-cards" style="grid-template-columns: repeat(4, 1fr);">
        <div class="card">
          <div class="card-body" style="text-align: center;">
            <div style="font-size: 2rem; margin-bottom: var(--spacing-sm); color: var(--primary-color);"><i data-lucide="BookOpen" style="width:1em;height:1em;"></i></div>
            <div style="font-size: var(--text-3xl); font-weight: 700; color: var(--primary-color);">0</div>
            <div class="text-muted">总故事</div>
          </div>
        </div>
        <div class="card">
          <div class="card-body" style="text-align: center;">
            <div style="font-size: 2rem; margin-bottom: var(--spacing-sm); color: var(--warning-color);"><i data-lucide="PenTool" style="width:1em;height:1em;"></i></div>
            <div style="font-size: var(--text-3xl); font-weight: 700; color: var(--warning-color);">0</div>
            <div class="text-muted">写作中</div>
          </div>
        </div>
        <div class="card">
          <div class="card-body" style="text-align: center;">
            <div style="font-size: 2rem; margin-bottom: var(--spacing-sm); color: var(--success-color);"><i data-lucide="CheckCircle" style="width:1em;height:1em;"></i></div>
            <div style="font-size: var(--text-3xl); font-weight: 700; color: var(--success-color);">0</div>
            <div class="text-muted">已完成</div>
          </div>
        </div>
        <div class="card">
          <div class="card-body" style="text-align: center;">
            <div style="font-size: 2rem; margin-bottom: var(--spacing-sm); color: var(--info-color);"><i data-lucide="FileEdit" style="width:1em;height:1em;"></i></div>
            <div style="font-size: var(--text-3xl); font-weight: 700; color: var(--info-color);">0</div>
            <div class="text-muted">总字数</div>
          </div>
        </div>
      </div>
    </section>

    <!-- 筛选栏 -->
    <div class="card" style="margin-bottom: var(--spacing-xl);">
      <div class="card-body">
        <div class="flex gap-lg items-center" style="flex-wrap: wrap;">
          <div class="form-group" style="margin-bottom: 0; flex: 1; min-width: 200px;">
            <input type="text" class="form-input" placeholder="搜索故事标题、内容...">
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <select class="form-input" id="filterWorld">
              <option value="">全部世界观</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <select class="form-input">
              <option value="">全部状态</option>
              <option value="writing">写作中</option>
              <option value="completed">已完成</option>
              <option value="draft">草稿</option>
            </select>
          </div>
          <button class="btn btn-primary">
            <i data-lucide="Search"></i>
            搜索
          </button>
        </div>
      </div>
    </div>

    <!-- 故事列表 -->
    <section>
      <div class="flex justify-between items-center" style="margin-bottom: var(--spacing-lg);">
        <div class="text-muted" id="storyCount">
          共 <strong>0</strong> 个故事（点击下方卡片创建新故事）
        </div>
        <div class="flex gap-sm">
          <select class="form-input" style="width: auto;">
            <option value="recent">最近更新</option>
            <option value="name">名称排序</option>
            <option value="words">字数排序</option>
          </select>
        </div>
      </div>
      
      <div class="grid-cards" id="storiesList">
        <!-- 添加新故事卡片 -->
        <div class="card card-clickable animate-slideUp" onclick="showCreateStoryModal()" style="border: 2px dashed var(--border-color); background: transparent;">
          <div class="card-body" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 200px;">
            <div style="font-size: 3rem; color: var(--text-muted); margin-bottom: var(--spacing-md);">
              <i data-lucide="Plus"></i>
            </div>
            <p class="text-muted">创建新故事</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 创建故事模态框 -->
  <div class="modal-overlay" id="createStoryModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">创建新故事</h3>
        <button class="modal-close" onclick="closeModal('createStoryModal')">
          <i data-lucide="X"></i>
        </button>
      </div>
      <div class="modal-body">
        <form id="createStoryForm">
          <div class="form-group">
            <label class="form-label required">故事标题</label>
            <input type="text" class="form-input" placeholder="输入故事标题..." required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label required">所属世界观</label>
              <select class="form-input" id="storyWorldSelect" required>
                <option value="">选择世界观...</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">故事类型</label>
              <select class="form-input">
                <option value="">选择类型...</option>
                <option value="epic">史诗</option>
                <option value="adventure">冒险</option>
                <option value="romance">爱情</option>
                <option value="mystery">悬疑</option>
                <option value="tragedy">悲剧</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">故事梗概</label>
            <textarea class="form-input form-textarea" placeholder="简述故事的主要情节..."></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">出场角色</label>
            <div class="tag-group" id="storyCharPicker" onclick="pickStoryCharacters()" style="padding: var(--spacing-md); background: var(--bg-tertiary); border-radius: var(--radius-md); cursor: pointer; min-height: 40px;">
              <span class="text-muted text-sm" id="storyCharPlaceholder">点击添加角色...</span>
              <div id="storyCharTags" style="display: flex; flex-wrap: wrap; gap: 6px;"></div>
            </div>
            <input type="hidden" id="storyCharacterIds" value="">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('createStoryModal')">取消</button>
        <button class="btn btn-primary" onclick="createStory()">
          <i data-lucide="Plus"></i>
          创建故事
        </button>
      </div>
    </div>
  </div>

  <!-- 灵感碎片模态框 -->
  <div class="modal-overlay" id="inspirationModal">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3 class="modal-title">灵感碎片</h3>
        <button class="modal-close" onclick="closeModal('inspirationModal')">
          <i data-lucide="X"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="flex gap-md" style="margin-bottom: var(--spacing-lg);">
          <input type="text" class="form-input" placeholder="记录你的灵感..." style="flex: 1;">
          <button class="btn btn-primary">
            <i data-lucide="Plus"></i>
            添加
          </button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--spacing-md);">
          <div class="empty-state" style="grid-column: span 2; padding: var(--spacing-xl); text-align: center;">
            <p class="text-muted">暂无灵感碎片，点击上方添加按钮记录你的灵感</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="../js/app.js"></script>
  <script src="../js/appwrite.js"></script>
  <script src="../js/api-client.js"></script>
  <script src="../js/data.js"></script>
  <script>
    // 页面初始化
    document.addEventListener('DOMContentLoaded', async function() {
      initTheme();
      // 初始化 Appwrite 数据模式
      await OCData.initDataMode();
      // 加载故事列表和世界观筛选
      await Promise.all([loadStories(), loadWorldFilters()]);
      try { if (window.lucide) lucide.createIcons(); } catch(e) {}
      setTimeout(function() { try { if (window.lucide) lucide.createIcons(); } catch(e) {} }, 200);
      setTimeout(function() { try { if (window.lucide) lucide.createIcons(); } catch(e) {} }, 500);
    });

    // 加载世界观到侧边栏筛选 + 顶部筛选框
    async function loadWorldFilters() {
      let worlds;
      try {
        worlds = await OCData.getWorlds();
      } catch (e) {
        worlds = [];
      }
      const sideContainer = document.getElementById('worldFilterList');
      const topSelect = document.getElementById('filterWorld');
      if (!worlds || worlds.length === 0) {
        if (sideContainer) sideContainer.innerHTML = '<div class="empty-state" style="padding: var(--spacing-md); text-align: center; color: var(--text-muted); font-size: 0.875rem;"><p>暂无世界观</p></div>';
        return;
      }
      // 侧边栏
      if (sideContainer) {
        sideContainer.innerHTML = worlds.map(w =>
          `<a href="#" class="sidebar-nav-item" onclick="filterByWorld('${w.$id || w.id}')">
            <span class="icon"><i data-lucide="Globe" style="width:0.9rem;height:0.9rem;"></i></span>
            <span>${w.name || '未命名'}</span>
          </a>`
        ).join('');
      }
      // 顶部筛选下拉框
      if (topSelect) {
        worlds.forEach(w => {
          const opt = document.createElement('option');
          opt.value = w.$id || w.id;
          opt.textContent = w.name || '未命名';
          topSelect.appendChild(opt);
        });
      }
      try { if (window.lucide) lucide.createIcons(); } catch(e) {}
    }

    // 按世界观筛选（侧边栏）
    function filterByWorld(worldId) {
      console.log('按世界观筛选:', worldId);
      // TODO: 实现筛选逻辑
    }

    // 显示创建故事模态框 + 填充世界观下拉
    async function showCreateStoryModal() {
      const modal = document.getElementById('createStoryModal');
      modal.classList.add('active');
      // 异步加载世界观选项
      const select = document.getElementById('storyWorldSelect');
      if (!select) return;
      try {
        const worlds = await OCData.getWorlds();
        if (worlds && worlds.length > 0) {
          select.innerHTML = '<option value="">选择世界观...</option>' +
            worlds.map(w => `<option value="${w.$id || w.id}">${w.name || '未命名'}</option>`).join('');
        } else {
          select.innerHTML = '<option value="" disabled>暂无世界观，请先创建</option>';
        }
      } catch (e) {
        console.warn('加载世界观失败:', e);
        select.innerHTML = '<option value="" disabled>加载失败，请重试</option>';
      }
    }

    // 显示灵感碎片模态框
    function showInspirationModal() {
      document.getElementById('inspirationModal').classList.add('active');
    }

    // 关闭模态框
    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    // 加载并渲染故事列表
    async function loadStories() {
      const container = document.getElementById('storiesList');
      const countEl = document.getElementById('storyCount');
      if (!container) return;

      try {
        // 先并行拉取故事+世界观，避免 [object Promise]
        const [stories, worlds] = await Promise.all([
          OCData.getStories(),
          preloadWorldNames()
        ]);

        // 更新统计卡片和计数
        const total = stories.length;
        const writing = stories.filter(s => s.status === 'writing').length;
        const completed = stories.filter(s => s.status === 'completed').length;
        const totalWords = stories.reduce((sum, s) => sum + (s.wordCount || 0), 0);

        // 更新统计数字
        const statCards = container.parentElement?.parentElement?.querySelectorAll('.card-body[style*="text-align: center"]') || [];
        // 简单方式：直接用 querySelector 找统计区域的数字
        const statsArea = document.querySelector('.grid-cards[style*="grid-template-columns: repeat(4"]');
        if (statsArea) {
          const cells = statsArea.querySelectorAll('.card-body');
          if (cells[0]) cells[0].querySelector('div:nth-child(2)').textContent = total;
          if (cells[1]) cells[1].querySelector('div:nth-child(2)').textContent = writing;
          if (cells[2]) cells[2].querySelector('div:nth-child(2)').textContent = completed;
          if (cells[3]) cells[3].querySelector('div:nth-child(2)').textContent = totalWords;
        }
        if (countEl) countEl.innerHTML = `共 <strong>${total}</strong> 个故事${total === 0 ? '（点击下方卡片创建新故事）' : ''}`;

        // 渲染故事列表（保留"添加新故事"卡片）
        let html = `<div class="card card-clickable animate-slideUp" onclick="showCreateStoryModal()" style="border: 2px dashed var(--border-color); background: transparent;">
          <div class="card-body" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 200px;">
            <div style="font-size: 3rem; color: var(--text-muted); margin-bottom: var(--spacing-md);">
              <i data-lucide="Plus"></i>
            </div>
            <p class="text-muted">创建新故事</p>
          </div>
        </div>`;

        for (const s of stories) {
          const statusLabel = s.status === 'completed' ? '已完成' : s.status === 'writing' ? '写作中' : '草稿';
          const statusTag = s.status === 'completed' ? 'success' : s.status === 'writing' ? 'primary' : 'warning';
          html += `<div class="card story-card" onclick="viewStory('${s.$id || s.id}')">
            <div class="card-body">
              <h3 style="margin-bottom: var(--spacing-xs);">${s.title || '未命名故事'}</h3>
              ${s.description ? `<p class="text-muted text-sm" style="margin:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">${s.description}</p>` : ''}
              <div style="margin-top: var(--spacing-sm); display: flex; gap: var(--spacing-sm);">
                <span class="tag tag-${statusTag}">${statusLabel}</span>
                <span class="text-muted text-sm">${s.wordCount || 0} 字</span>
                ${s.worldId ? `<span class="text-muted text-sm"><i data-lucide="Globe" style="width:0.8rem;height:0.8rem;display:inline;vertical-align:-2px;"></i> ${getWorldNameSync(s.worldId)}</span>` : ''}
              </div>
            </div>
          </div>`;
        }
        container.innerHTML = html;
        try { if (window.lucide) lucide.createIcons(); } catch(e) {}
      } catch (err) {
        console.error('加载故事失败:', err);
      }
    }

    // 缓存世界观名称映射（避免重复查询）
    let _worldNameCache = null;
    async function preloadWorldNames() {
      if (!_worldNameCache) {
        try { _worldNameCache = await OCData.getWorlds().catch(() => []); } catch { _worldNameCache = []; }
      }
      return _worldNameCache;
    }
    function getWorldNameSync(worldId) {
      if (!_worldNameCache) return '';
      const w = _worldNameCache.find(x => (x.$id || x.id) === worldId);
      return w ? w.name : '';
    }

    // 创建故事（接入 OCData 云端/本地双模式）
    async function createStory() {
      const form = document.getElementById('createStoryForm');
      const inputs = form.querySelectorAll('input, textarea, select');
      // 表单顺序: [title input, world select, type select, description textarea]
      const title = inputs[0].value.trim();
      const worldId = inputs[1].value;
      const storyType = inputs[2].value;
      const description = inputs[3] ? inputs[3].value.trim() : '';
      const characterIds = (document.getElementById('storyCharacterIds').value || '').split(',').filter(Boolean);

      if (!title) {
        showNotification('请填写故事标题', 'warning'); return;
      }
      if (!worldId) {
        showNotification('请选择所属世界观', 'warning'); return;
      }

      try {
        // 云端 API 用 summary/content，本地用 description；两边都传保证兼容
        await OCData.createStory({
          title, worldId, type: storyType,
          description, summary: description, content: '',
          characters: characterIds
        });
        closeModal('createStoryModal');
        form.reset();
        document.getElementById('storyCharacterIds').value = '';
        document.getElementById('storyCharTags').innerHTML = '';
        document.getElementById('storyCharPlaceholder').style.display = '';
        showNotification('故事创建成功！', 'success');
        await loadStories();
        _worldNameCache = null;
      } catch (err) {
        console.error('创建故事失败:', err);
        showNotification('创建失败：' + (err.message || '未知错误'), 'error');
      }
    }

    // 选择出场角色（弹出简单多选）
    async function pickStoryCharacters() {
      let chars;
      try { chars = await OCData.getCharacters(); } catch (e) { chars = []; }
      if (!chars || chars.length === 0) {
        showNotification('暂无角色可添加，先去角色页创建一个吧', 'warning');
        return;
      }
      const currentIds = (document.getElementById('storyCharacterIds').value || '').split(',').filter(Boolean);
      const items = chars.map(c => {
        const cid = c.$id || c.id;
        const checked = currentIds.includes(cid) ? 'checked' : '';
        return `<label style="display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;">
          <input type="checkbox" value="${cid}" data-name="${c.name || '未命名'}" ${checked}>
          <span>${c.name || '未命名'}</span>
        </label>`;
      }).join('');

      // 用简易 modal 方式展示（直接复用 createStoryModal 遮罩层逻辑太复杂，用 confirm 风格）
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;display:flex;align-items:center;justify-content:center;';
      overlay.innerHTML = `<div style="background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:12px;padding:20px;width:320px;max-height:60vh;overflow:auto;box-shadow:0 20px 40px rgba(0,0,0,0.3);">
        <h4 style="margin:0 0 12px 0;">选择出场角色</h4>
        <div style="margin-bottom:16px;">${items}</div>
        <div style="display:flex;gap:8px;justify-content:flex-end;">
          <button id="_charCancel" class="btn btn-secondary" style="padding:6px 14px;font-size:0.85rem;">取消</button>
          <button id="_charOk" class="btn btn-primary" style="padding:6px 14px;font-size:0.85rem;">确定</button>
        </div>
      </div>`;
      document.body.appendChild(overlay);

      overlay.querySelector('#_charCancel').onclick = () => overlay.remove();
      overlay.querySelector('#_charOk').onclick = () => {
        const checked = overlay.querySelectorAll('input[type="checkbox"]:checked');
        const ids = []; const names = [];
        checked.forEach(cb => { ids.push(cb.value); names.push(cb.dataset.name); });
        document.getElementById('storyCharacterIds').value = ids.join(',');
        const tagContainer = document.getElementById('storyCharTags');
        tagContainer.innerHTML = names.map(n => `<span class="tag" style="background:var(--accent-primary);color:#fff;">${n}</span>`).join('');
        document.getElementById('storyCharPlaceholder').style.display = names.length ? 'none' : '';
        overlay.remove();
      };
      overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
    }

    // 查看并编辑故事（打开编辑器模态框）
    async function viewStory(storyId) {
      // 先加载故事数据
      let story;
      try {
        const allStories = await OCData.getStories();
        story = allStories.find(s => (s.$id || s.id) === storyId);
      } catch (e) {
        console.error('加载故事失败:', e);
        showNotification('加载故事失败', 'error');
        return;
      }
      if (!story) {
        showNotification('故事不存在', 'warning'); return;
      }

      // 预加载世界观
      await preloadWorldNames();

      const statusLabel = story.status === 'completed' ? '已完成' : story.status === 'writing' ? '写作中' : '草稿';
      const statusTag = story.status === 'completed' ? 'success' : story.status === 'writing' ? 'primary' : 'warning';
      const worldName = getWorldNameSync(story.worldId);

      // 创建编辑模态框（动态注入，避免修改 HTML 结构太多）
      let editorModal = document.getElementById('storyEditorModal');
      if (!editorModal) {
        editorModal = document.createElement('div');
        editorModal.id = 'storyEditorModal';
        editorModal.className = 'modal-overlay active';
        document.body.appendChild(editorModal);

        // 点击背景关闭
        editorModal.onclick = function(e) { if (e.target === editorModal) closeStoryEditor(); };
      } else {
        editorModal.classList.add('active');
      }

      editorModal.innerHTML = `
        <div class="modal modal-lg" style="max-width:900px;max-height:90vh;overflow-y:auto;" onclick="event.stopPropagation()">
          <div class="modal-header" style="position:sticky;top:0;background:var(--bg-secondary);z-index:1;">
            <div style="display:flex;align-items:center;gap:12px;">
              <h3 class="modal-title" style="margin:0;" id="editorTitle">${story.title || '未命名故事'}</h3>
              <span class="tag tag-${statusTag}" id="editorStatusTag">${statusLabel}</span>
            </div>
            <button class="modal-close" onclick="closeStoryEditor()" style="cursor:pointer;">
              <i data-lucide="X"></i>
            </button>
          </div>
          <div class="modal-body">
            <!-- 基本信息区 -->
            <div class="form-row" style="margin-bottom: var(--spacing-md);">
              <div class="form-group" style="flex:2;">
                <label class="form-label">标题</label>
                <input type="text" class="form-input" id="editTitle" value="${(story.title || '').replace(/"/g, '&quot;')}">
              </div>
              <div class="form-group" style="flex:1;">
                <label class="form-label">状态</label>
                <select class="form-input" id="editStatus">
                  <option value="draft" ${story.status === 'draft' ? 'selected' : ''}>草稿</option>
                  <option value="writing" ${story.status === 'writing' ? 'selected' : ''}>写作中</option>
                  <option value="completed" ${story.status === 'completed' ? 'selected' : ''}>已完成</option>
                </select>
              </div>
            </div>
            <div class="form-group" style="margin-bottom: var(--spacing-md);">
              <label class="form-label">所属世界观</label>
              <input type="text" class="form-input" value="${worldName}" disabled style="opacity:.7;">
            </div>

            <!-- 故事梗概 -->
            <div class="form-group" style="margin-bottom: var(--spacing-md);">
              <label class="form-label">故事梗概</label>
              <textarea class="form-input form-textarea" id="editSummary" rows="3" placeholder="简述故事的主要情节...">${(story.description || story.summary || '').replace(/</g, '&lt;')}</textarea>
            </div>

            <!-- 正文编辑区 -->
            <div class="form-group" style="margin-bottom: var(--spacing-md);">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                <label class="form-label" style="margin:0;">正文内容</label>
                <span class="text-muted text-sm" id="editWordCount">0 字</span>
              </div>
              <textarea class="form-input form-textarea" id="editContent"
                rows="20" style="font-size:1rem;line-height:1.8;min-height:400px;"
                placeholder="在这里写下你的故事...">${(story.content || '').replace(/</g, '&lt;')}</textarea>
            </div>
          </div>
          <div class="modal-footer" style="position:sticky;bottom:0;background:var(--bg-secondary);z-index:1;">
            <button class="btn btn-danger" style="margin-right:auto;" onclick="deleteStoryConfirm('${story.$id || story.id}')">
              <i data-lucide="Trash2"></i> 删除
            </button>
            <button class="btn btn-secondary" onclick="closeStoryEditor()">取消</button>
            <button class="btn btn-primary" onclick="saveStory('${story.$id || story.id}')">
              <i data-lucide="Save"></i> 保存
            </button>
          </div>
        </div>`;

      // 字数统计
      updateWordCount();
      document.getElementById('editContent').addEventListener('input', updateWordCount);
      document.getElementById('editTitle').addEventListener('input', function() {
        document.getElementById('editorTitle').textContent = this.value || '未命名故事';
      });

      try { if (window.lucide) lucide.createIcons(); } catch(e) {}

      // 保存当前编辑的故事 ID
      _editingStoryId = story.$id || story.id;
    }

    let _editingStoryId = null;

    function updateWordCount() {
      const el = document.getElementById('editContent');
      const countEl = document.getElementById('editWordCount');
      if (el && countEl) countEl.textContent = el.value.length + ' 字';
    }

    function closeStoryEditor() {
      const m = document.getElementById('storyEditorModal');
      if (m) m.classList.remove('active');
      _editingStoryId = null;
    }

    async function saveStory(storyId) {
      const title = document.getElementById('editTitle').value.trim();
      const status = document.getElementById('editStatus').value;
      const summary = document.getElementById('editSummary').value.trim();
      const content = document.getElementById('editContent').value;

      if (!title) { showNotification('请填写标题', 'warning'); return; }

      try {
        await OCData.updateStory(storyId, {
          title, status,
          summary, description: summary,
          content, wordCount: content.length
        });
        showNotification('保存成功！', 'success');
        closeStoryEditor();
        _worldNameCache = null;  // 刷新缓存
        await loadStories();
      } catch (err) {
        console.error('保存失败:', err);
        showNotification('保存失败：' + (err.message || '未知错误'), 'error');
      }
    }

    async function deleteStoryConfirm(storyId) {
      if (!confirm('确定要删除这个故事吗？此操作不可恢复。')) return;
      try {
        await OCData.deleteStory(storyId);
        showNotification('已删除', 'success');
        closeStoryEditor();
        await loadStories();
      } catch (err) {
        console.error('删除失败:', err);
        showNotification('删除失败：' + (err.message || '未知错误'), 'error');
      }
    }

    // 通知提示（兼容 app.js 或本地定义，避免自己调自己死循环）
    const _nativeNotify = typeof window.showNotification === 'function' ? window.showNotification : null;
    function showNotification(msg, type) {
      if (_nativeNotify && _nativeNotify !== showNotification) {
        _nativeNotify(msg, type);
      } else {
        // fallback: 用简单 toast
        let toast = document.getElementById('_pageToast');
        if (!toast) {
          toast = document.createElement('div');
          toast.id = '_pageToast';
          toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:8px;z-index:99999;font-size:0.9rem;transition:opacity .3s;opacity:0;pointer-events:none;';
          document.body.appendChild(toast);
        }
        const colors = { success:'#059669', error:'#dc2626', warning:'#d97706', info:'#2563eb' };
        toast.style.background = colors[type] || colors.info;
        toast.style.color = '#fff';
        toast.textContent = msg;
        toast.style.opacity = '1';
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => { toast.style.opacity = '0'; }, 3000);
      }
    }

    // 筛选故事（保留侧边栏功能，改为调用 loadStories）
    function filterStories(status) {
      console.log('筛选状态:', status);
      // TODO: 实现前端筛选或重新请求带 status 参数
    }
  </script>
</body>
