<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关系图谱 - OC宇宙</title>
  <!-- 主题初始化（必须最靠前） -->
  <script>
    try { var t = localStorage.getItem('oc_theme') || 'light'; document.documentElement.setAttribute('data-theme', t); } catch(e) {}
  </script>
  <!-- 关键主题色 & 暗色变量（必须内联，防止闪白） -->
  <style>
    html, body { background-color: #FFFFFF; }
    html[data-theme="dark"], html[data-theme="dark"] body { background-color: #070B14; }
    html[data-theme="dark"] { --primary-color: #60A5FA; --primary-hover: #93C5FD; --bg-primary: #070B14; --bg-secondary: #0D1424; --bg-tertiary: #111827; --bg-card: #0D1424; --bg-sidebar: #090E1A; --text-primary: #E2E8F0; --text-secondary: #94A3B8; --text-muted: #64748B; --text-inverse: #FFFFFF; --border-color: #1E2D4A; --border-light: #243354; }
  </style>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/dark-mode.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- Google Fonts -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <!-- Appwrite Web SDK -->
  <script defer src="https://cdn.jsdelivr.net/npm/appwrite@17/dist/iife/sdk.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    .graph-container {
      display: flex;
      height: calc(100vh - 64px);
      margin-top: 64px;
    }
    .graph-sidebar {
      width: 300px;
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .graph-main {
      flex: 1;
      position: relative;
      background-color: var(--bg-primary);
    }
    .graph-toolbar {
      position: absolute;
      top: var(--spacing-lg);
      left: var(--spacing-lg);
      z-index: 10;
      display: flex;
      gap: var(--spacing-sm);
    }
    .graph-legend {
      position: absolute;
      bottom: var(--spacing-lg);
      left: var(--spacing-lg);
      z-index: 10;
      background-color: var(--bg-secondary);
      padding: var(--spacing-md);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-xs);
    }
    .legend-color {
      width: 16px;
      height: 16px;
      border-radius: var(--radius-sm);
    }
    .graph-info {
      position: absolute;
      top: var(--spacing-lg);
      right: var(--spacing-lg);
      z-index: 10;
      background-color: var(--bg-secondary);
      padding: var(--spacing-lg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      max-width: 300px;
      display: none;
    }
    .graph-info.active {
      display: block;
      animation: scaleIn 0.3s ease-out;
    }
    #relationshipChart {
      width: 100%;
      height: 100%;
    }
    .filter-section {
      padding: var(--spacing-md);
      border-bottom: 1px solid var(--border-color);
    }
    .character-filter-item {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      padding: var(--spacing-sm);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .character-filter-item:hover {
      background-color: var(--bg-tertiary);
    }
    .character-filter-item.selected {
      background-color: var(--primary-light);
    }
    .relation-type-filter {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      padding: var(--spacing-sm) var(--spacing-md);
      border-radius: var(--radius-md);
      cursor: pointer;
      margin-bottom: var(--spacing-xs);
    }
    .relation-type-filter:hover {
      background-color: var(--bg-tertiary);
    }
    .relation-type-filter input {
      width: auto;
    }
    @media (max-width: 1024px) {
      .graph-sidebar {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <button class="navbar-toggle btn-ghost btn-icon" id="sidebarToggle">
      <i data-lucide="Menu"></i>
    </button>
    <a href="../index.html" class="navbar-brand">
      <span class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.5"/>
          <ellipse cx="12" cy="12" rx="9" ry="2.5" stroke="currentColor" stroke-width="1" transform="rotate(-25 12 12)"/>
          <circle cx="19" cy="7" r="1.5" fill="currentColor" opacity="0.8"/>
        </svg>
      </span>
      <span>OC宇宙</span>
    </a>
    <div class="navbar-menu">
      <a href="../index.html">世界观</a>
      <a href="characters.html">角色</a>
      <a href="stories.html">故事</a>
      <a href="chat.html">AI聊天</a>
      <a href="relationship-map.html" class="active">关系图谱</a>
    </div>
    <div class="navbar-actions">
      <button class="theme-toggle" id="themeToggle" title="切换主题">
        <i data-lucide="Moon" class="icon-moon"></i>
        <i data-lucide="Sun" class="icon-sun"></i>
      </button>
      <a href="admin.html" class="btn btn-primary btn-sm">
        <i data-lucide="Settings"></i>
        <span>管理后台</span>
      </a>
    </div>
  </nav>

  <!-- 图谱容器 -->
  <div class="graph-container">
    <!-- 左侧筛选面板 -->
    <aside class="graph-sidebar">
      <div class="card-header">
        <h3 class="card-title"><i data-lucide="Network" style="width:1.2em;height:1.2em;vertical-align:middle;margin-right:4px;"></i> 关系图谱</h3>
      </div>
      
      <div class="filter-section">
        <div class="sidebar-section-title">选择世界观</div>
        <select class="form-input" id="worldSelect" onchange="loadWorldGraph(this.value)">
          <option value="">请先创建世界观</option>
        </select>
      </div>
      
      <div class="filter-section">
        <div class="sidebar-section-title">关系类型筛选</div>
        <div id="relationTypeFilters">
          <div class="empty-state" style="padding: var(--spacing-md); text-align: center;">
            <p class="text-muted text-sm">暂无自定义关系类型</p>
            <button class="btn btn-ghost btn-sm" style="margin-top: var(--spacing-sm);" onclick="showCreateRelationTypeModal()">
              <i data-lucide="Plus"></i> 创建关系类型
            </button>
          </div>
        </div>
      </div>
      
      <div class="filter-section">
        <div class="sidebar-section-title">角色筛选</div>
        <input type="text" class="form-input" placeholder="搜索角色..." style="margin-bottom: var(--spacing-md);">
        <div class="empty-state" style="padding: var(--spacing-lg); text-align: center;">
          <p class="text-muted text-sm">暂无角色</p>
        </div>
      </div>
      
      <div class="filter-section">
        <div class="sidebar-section-title">时间轴筛选</div>
        <select class="form-input">
          <option value="all">全部时间</option>
          <option value="before">帝国历1260年前</option>
          <option value="during">帝国历1260-1270年</option>
          <option value="after">帝国历1270年后</option>
        </select>
        <p class="text-sm text-muted" style="margin-top: var(--spacing-sm);">
          选择时间点查看关系变化
        </p>
      </div>
      
      <div style="padding: var(--spacing-md); margin-top: auto; border-top: 1px solid var(--border-color);">
        <button class="btn btn-primary" style="width: 100%;" onclick="showAddRelationModal()">
          <i data-lucide="Plus"></i>
          添加关系
        </button>
      </div>
    </aside>

    <!-- 主图谱区域 -->
    <main class="graph-main">
      <!-- 工具栏 -->
      <div class="graph-toolbar">
        <button class="btn btn-secondary" onclick="zoomIn()">
          <i data-lucide="ZoomIn"></i>
        </button>
        <button class="btn btn-secondary" onclick="zoomOut()">
          <i data-lucide="ZoomOut"></i>
        </button>
        <button class="btn btn-secondary" onclick="resetZoom()">
          <i data-lucide="Maximize2"></i>
        </button>
        <button class="btn btn-secondary" onclick="downloadGraph()">
          <i data-lucide="Download"></i>
        </button>
        <select class="form-input" style="width: auto;" onchange="changeLayout(this.value)">
          <option value="force">力导向布局</option>
          <option value="circular">环形布局</option>
          <option value="tree">树形布局</option>
        </select>
      </div>

      <!-- 图表 -->
      <div id="relationshipChart"></div>

      <!-- 图例 -->
      <div class="graph-legend" id="graphLegend">
        <div class="sidebar-section-title">关系类型</div>
        <div id="legendItems">
          <div class="empty-state" style="padding: var(--spacing-md); text-align: center;">
            <p class="text-muted text-sm">暂无关系类型</p>
          </div>
        </div>
      </div>

      <!-- 角色详情面板 -->
      <div class="graph-info" id="characterInfo">
        <div class="flex items-center gap-md" style="margin-bottom: var(--spacing-md);">
          <img src="" alt="" class="avatar avatar-lg" id="infoAvatar">
          <div>
            <h3 style="margin: 0;" id="infoName">角色名称</h3>
            <p class="text-sm text-muted" style="margin: 0;" id="infoMeta">种族 · 年龄</p>
          </div>
        </div>
        <p class="text-sm" id="infoDesc">角色简介...</p>
        <div style="margin-top: var(--spacing-md);">
          <div class="sidebar-section-title">关系数量</div>
          <div class="flex gap-md" style="margin-top: var(--spacing-sm);">
            <div style="text-align: center;">
              <div style="font-size: var(--text-xl); font-weight: 700; color: var(--primary-color);" id="infoRelations">0</div>
              <div class="text-xs text-muted">关系</div>
            </div>
            <div style="text-align: center;">
              <div style="font-size: var(--text-xl); font-weight: 700; color: var(--success-color);" id="infoFriends">0</div>
              <div class="text-xs text-muted">友好</div>
            </div>
            <div style="text-align: center;">
              <div style="font-size: var(--text-xl); font-weight: 700; color: var(--error-color);" id="infoEnemies">0</div>
              <div class="text-xs text-muted">敌对</div>
            </div>
          </div>
        </div>
        <div style="margin-top: var(--spacing-md);">
          <a href="#" class="btn btn-primary btn-sm" style="width: 100%;" id="infoLink">
            <i data-lucide="User"></i>
            查看详情
          </a>
        </div>
      </div>
    </main>
  </div>

  <!-- 添加关系模态框 -->
  <div class="modal-overlay" id="addRelationModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">添加关系</h3>
        <button class="modal-close" onclick="closeModal('addRelationModal')">
          <i data-lucide="X"></i>
        </button>
      </div>
      <div class="modal-body">
        <form>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label required">角色A</label>
              <select class="form-input" id="relationCharA" required>
                <option value="">暂无角色</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label required">角色B</label>
              <select class="form-input" id="relationCharB" required>
                <option value="">暂无角色</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label required">关系类型</label>
              <select class="form-input" id="relationTypeSelect" required onchange="handleRelationTypeChange()">
                <option value="">选择类型...</option>
                <!-- 关系类型将通过JS动态加载 -->
              </select>
              <button type="button" class="btn btn-ghost btn-sm" style="margin-top: var(--spacing-xs);" onclick="showCreateRelationTypeModal()">
                <i data-lucide="Plus"></i> 创建新关系类型
              </button>
            </div>
            <div class="form-group">
              <label class="form-label">关系颜色</label>
              <input type="color" id="relationColor" value="#5470c6" style="width: 100%; height: 40px; border: none; cursor: pointer;">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">关系描述（自定义关系名称）</label>
            <input type="text" class="form-input" id="relationDesc" placeholder="如：挚友、师徒、死敌...">
          </div>
          <div class="form-group">
            <label class="form-label">关系强度</label>
            <input type="range" id="relationStrength" min="0" max="100" value="50" style="width: 100%;">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('addRelationModal')">取消</button>
        <button class="btn btn-primary" onclick="addRelation()">
          <i data-lucide="Plus"></i>
          添加关系
        </button>
      </div>
    </div>
  </div>

  <!-- 创建关系类型模态框 -->
  <div class="modal-overlay" id="createRelationTypeModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">创建关系类型</h3>
        <button class="modal-close" onclick="closeModal('createRelationTypeModal')">
          <i data-lucide="X"></i>
        </button>
      </div>
      <div class="modal-body">
        <form id="createRelationTypeForm">
          <div class="form-group">
            <label class="form-label required">关系名称</label>
            <input type="text" class="form-input" id="relationTypeName" placeholder="如：挚友、师徒、死敌、竞争对手..." required>
          </div>
          <div class="form-group">
            <label class="form-label">关系颜色</label>
            <input type="color" id="relationTypeColor" value="#5470c6" style="width: 100%; height: 40px; border: none; cursor: pointer;">
          </div>
          <div class="form-group">
            <label class="form-label">关系描述</label>
            <input type="text" class="form-input" id="relationTypeDesc" placeholder="描述这种关系的特点">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('createRelationTypeModal')">取消</button>
        <button class="btn btn-primary" onclick="createRelationType()">
          <i data-lucide="Plus"></i>
          创建关系类型
        </button>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="../js/app.js"></script>
  <script src="../js/appwrite.js"></script>
  <script src="../js/api-client.js"></script>
  <script src="../js/data.js"></script>
  <script>
    let chart;

    // ---- 存储键 ----
    const RELATION_TYPE_KEY = 'oc_relation_types';
    const RELATIONS_KEY = 'oc_relations';

    // ---- 缓存数据 ----
    let _allWorlds = [];
    let _allCharacters = [];
    let _allRelations = [];
    let _currentWorldId = null;
    let _chartZoom = 1;

    // 页面初始化
    document.addEventListener('DOMContentLoaded', async function() {
      initTheme();
      await OCData.initDataMode();
      loadRelationTypes();
      loadRelationTypeFilters();
      initGraph();
      await loadWorldSelect();     // 填充世界观下拉框
      try { if (window.lucide) lucide.createIcons(); } catch(e) {}
      setTimeout(function() { try { if (window.lucide) lucide.createIcons(); } catch(e) {} }, 300);
    });

    // ==================== 世界观 ====================
    async function loadWorldSelect() {
      try { _allWorlds = await OCData.getWorlds().catch(() => []); } catch { _allWorlds = []; }
      const select = document.getElementById('worldSelect');
      if (!select) return;
      if (_allWorlds.length === 0) {
        select.innerHTML = '<option value="">请先创建世界观</option>';
        return;
      }
      select.innerHTML = '<option value="">全部世界观</option>' +
        _allWorlds.map(w => `<option value="${w.$id || w.id}">${w.name || '未命名'}</option>`).join('');
      // 自动选中第一个有角色的世界观
      for (const w of _allWorlds) {
        const wid = w.$id || w.id;
        select.value = wid;
        await loadWorldGraph(wid);
        if (_allCharacters.length > 0) break;
      }
    }

    async function loadWorldGraph(worldId) {
      _currentWorldId = worldId || null;
      // 加载角色
      try { _allCharacters = await OCData.getCharacters().catch(() => []); } catch { _allCharacters = []; }
      if (worldId) {
        _allCharacters = _allCharacters.filter(c => (c.worldId || '') === worldId);
      }
      // 加载关系
      loadRelationsFromStorage();

      // 更新侧边栏角色列表
      renderCharacterFilterList();
      // 填充添加关系的角色下拉框
      populateRelationCharSelects();
      // 渲染图谱（延迟确保 DOM 布局完成）
      requestAnimationFrame(() => renderGraph());
    }

    // ==================== 角色侧边栏列表 ====================
    function renderCharacterFilterList() {
      const container = document.querySelector('.graph-sidebar .filter-section:last-of-type .empty-state');
      if (!container) return; // 找角色筛选区的 empty-state
      const section = container.parentElement;
      if (_allCharacters.length === 0) {
        section.innerHTML = `<div class="empty-state" style="padding: var(--spacing-lg); text-align: center;">
          <p class="text-muted text-sm">暂无角色（该世界观下没有角色）</p>
        </div>`;
        return;
      }
      section.innerHTML = `<input type="text" class="form-input" placeholder="搜索角色..." id="charSearchInput" oninput="filterCharacterList(this.value)" style="margin-bottom: var(--spacing-md);">
        <div id="characterFilterList" style="max-height:240px;overflow-y:auto;"></div>`;
      filterCharacterList('');
    }

    function filterCharacterList(keyword) {
      const container = document.getElementById('characterFilterList');
      if (!container) return;
      const kw = (keyword || '').toLowerCase();
      const filtered = kw ? _allCharacters.filter(c => (c.name || '').toLowerCase().includes(kw)) : _allCharacters;
      if (filtered.length === 0) {
        container.innerHTML = `<p class="text-muted text-sm" style="padding:8px;text-align:center;">无匹配结果</p>`;
        return;
      }
      container.innerHTML = filtered.map(c =>
        `<div class="character-filter-item" onclick="focusNode('${c.$id || c.id}')">
          <span style="width:28px;height:28px;border-radius:50%;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:600;color:var(--primary-color);">${(c.name || '?')[0]}</span>
          <span style="flex:1;">${c.name || '未命名'}</span>
        </div>`
      ).join('');
    }

    // ==================== 关系 CRUD（localStorage）====================
    function getRelations() {
      try { return JSON.parse(localStorage.getItem(RELATIONS_KEY) || '[]'); } catch { return []; }
    }
    function saveRelations(list) { localStorage.setItem(RELATIONS_KEY, JSON.stringify(list)); }

    function loadRelationsFromStorage() {
      _allRelations = getRelations();
      // 过滤当前世界观的关系
      if (_currentWorldId) {
        const charIds = new Set(_allCharacters.map(c => c.$id || c.id));
        _allRelations = _allRelations.filter(r =>
          charIds.has(r.sourceId) && charIds.has(r.targetId)
        );
      }
    }

    function addRelation() {
      const charA = document.getElementById('relationCharA');
      const charB = document.getElementById('relationCharB');
      const typeSel = document.getElementById('relationTypeSelect');
      const desc = document.getElementById('relationDesc').value.trim();
      const color = document.getElementById('relationColor').value;
      const strength = parseInt(document.getElementById('relationStrength').value) || 50;

      if (!charA.value) { showNotification('请选择角色A', 'warning'); return; }
      if (!charB.value) { showNotification('请选择角色B', 'warning'); return; }
      if (charA.value === charB.value) { showNotification('不能和自己建立关系', 'warning'); return; }

      const typeOpt = typeSel.options[typeSel.selectedIndex];
      const relation = {
        id: 'r_' + Date.now(),
        sourceId: charA.value,
        targetId: charB.value,
        typeId: typeSel.value || null,
        typeName: typeSel.value ? typeOpt.textContent : (desc || '自定义关系'),
        description: desc || '',
        color: color,
        strength: strength,
        createdAt: new Date().toISOString()
      };

      const list = getRelations();
      list.push(relation);
      saveRelations(list);

      closeModal('addRelationModal');
      showNotification('关系添加成功', 'success');

      // 等模态框动画结束后再重新渲染（否则容器尺寸可能不对）
      setTimeout(() => {
        loadRelationsFromStorage();
        renderGraph();
      }, 300);
    }

    // 显示添加关系模态框 + 填充角色选项
    function showAddRelationModal() {
      populateRelationCharSelects();
      document.getElementById('addRelationModal').classList.add('active');
    }

    function populateRelationCharSelects() {
      [document.getElementById('relationCharA'), document.getElementById('relationCharB')].forEach(sel => {
        if (!sel) return;
        sel.innerHTML = '<option value="">选择角色...</option>' +
          _allCharacters.map(c => `<option value="${c.$id || c.id}">${c.name || '未命名'}</option>`).join('');
      });
    }

    // ==================== 关系类型 ====================
    function loadRelationTypes() {
      const types = JSON.parse(localStorage.getItem(RELATION_TYPE_KEY) || '[]');
      const select = document.getElementById('relationTypeSelect');
      if (!select) return;
      let options = '<option value="">选择类型...</option>';
      types.forEach(type => {
        options += `<option value="${type.id}" data-color="${type.color}">${type.name}</option>`;
      });
      select.innerHTML = options;
    }

    function handleRelationTypeChange() {
      const select = document.getElementById('relationTypeSelect');
      const selectedOption = select.options[select.selectedIndex];
      const color = selectedOption.getAttribute('data-color');
      if (color) document.getElementById('relationColor').value = color;
    }

    function showCreateRelationTypeModal() {
      document.getElementById('createRelationTypeModal').classList.add('active');
    }

    function createRelationType() {
      const name = document.getElementById('relationTypeName').value.trim();
      const color = document.getElementById('relationTypeColor').value;
      const desc = document.getElementById('relationTypeDesc').value.trim();
      if (!name) { showNotification('请输入关系名称', 'warning'); return; }

      const types = JSON.parse(localStorage.getItem(RELATION_TYPE_KEY) || '[]');
      if (types.some(t => t.name === name)) { showNotification('关系名称已存在', 'warning'); return; }

      types.push({ id: 'rt_' + Date.now(), name, color, desc, createdAt: new Date().toISOString() });
      localStorage.setItem(RELATION_TYPE_KEY, JSON.stringify(types));

      loadRelationTypes();
      loadRelationTypeFilters();
      closeModal('createRelationTypeModal');
      document.getElementById('relationTypeName').value = '';
      document.getElementById('relationTypeDesc').value = '';
      showNotification('关系类型创建成功', 'success');
    }

    function loadRelationTypeFilters() {
      const types = JSON.parse(localStorage.getItem(RELATION_TYPE_KEY) || '[]');
      const container = document.getElementById('relationTypeFilters');
      if (!container) return;
      if (types.length === 0) {
        container.innerHTML = `<div class="empty-state" style="padding: var(--spacing-md); text-align: center;">
          <p class="text-muted text-sm">暂无自定义关系类型</p>
          <button class="btn btn-ghost btn-sm" style="margin-top: var(--spacing-sm);" onclick="showCreateRelationTypeModal()">
            <i data-lucide="Plus"></i> 创建关系类型
          </button>
        </div>`;
        return;
      }
      container.innerHTML = types.map(type => `
        <div class="relation-type-filter">
          <input type="checkbox" checked id="filter-${type.id}" data-type-id="${type.id}" onchange="renderGraph()">
          <span style="color: ${type.color};">&#9679;</span>
          <label for="filter-${type.id}">${type.name}</label>
        </div>
      `).join('');
    }

    // ==================== ECharts 图谱渲染 ====================
    function initGraph() {
      chart = echarts.init(document.getElementById('relationshipChart'));
      chart.setOption({
        tooltip: {
          trigger: 'item',
          formatter: function(params) {
            if (params.dataType === 'node') {
              const d = params.data;
              let html = `<strong>${d.name}</strong>`;
              if (d.role) html += `<br/><span style="color:#94a3b8;">${d.role}</span>`;
              if (d.desc) html += `<br/>${d.desc}`;
              return html;
            } else {
              return `<strong>${params.data.relation}</strong><br/>强度: ${params.data.strength}%`;
            }
          }
        },
        animationDuration: 500,
        animationEasingUpdate: 'quinticInOut',
        series: [{
          type: 'graph',
          layout: 'force',
          animation: true,
          draggable: true,
          roam: true,
          label: {
            show: true,
            position: 'bottom',
            fontSize: 15,
            fontWeight: 'bold',
            color: '#FFFFFF',
            backgroundColor: 'rgba(96, 165, 250, 0.75)',
            borderColor: '#60A5FA',
            borderWidth: 1,
            borderRadius: 6,
            padding: [4, 8],
            shadowColor: 'rgba(0,0,0,0.5)',
            shadowBlur: 6,
            shadowOffsetY: 2
          },
          labelLayout: { hideOverlap: false },
          itemStyle: {
            borderColor: '#60A5FA',
            borderWidth: 2,
            shadowBlur: 10,
            shadowColor: 'rgba(96,165,250,0.3)'
          },
          lineStyle: { width: 2, curveness: 0.2 },
          emphasis: {
            focus: 'adjacency',
            lineStyle: { width: 4 },
            itemStyle: { borderColor: '#93C5FD', borderWidth: 3 }
          },
          force: { repulsion: 400, edgeLength: [120, 250], gravity: 0.15 },
          data: [],
          links: [],
          categories: []
        }]
      });

      chart.on('click', function(params) {
        if (params.dataType === 'node') showCharacterInfo(params.data);
      });
      window.addEventListener('resize', () => chart.resize());
    }

    function renderGraph() {
      if (!chart) {
        // chart 未初始化，尝试重新初始化
        try { initGraph(); } catch(e) { console.error('initGraph failed:', e); return; }
        if (!chart) return;
      }

      // 确保容器有正确尺寸（模态框关闭后容器可能塌陷）
      chart.resize();

      // 构建节点
      const nodes = _allCharacters.map((c, i) => ({
        id: c.$id || c.id,
        name: c.name || '未命名',
        role: c.gender ? `${c.age || ''} ${c.gender}` : '',
        desc: c.description || c.tags || '',
        symbolSize: Math.min(20 + (c.description || '').length / 5, 50),
        category: 0,
        x: Math.random() * 800,
        y: Math.random() * 500
      }));

      // 无节点时显示空状态提示
      if (nodes.length === 0) {
        chart.setOption({ series: [{ data: [], links: [] }] });
        updateLegend([]);
        return;
      }

      // 获取启用的关系类型
      const enabledTypes = new Set();
      document.querySelectorAll('#relationTypeFilters input[type="checkbox"]:checked').forEach(cb => {
        enabledTypes.add(cb.dataset.typeId);
      });

      // 构建连线（只包含启用类型的）
      const links = _allRelations.filter(r => !r.typeId || enabledTypes.has(r.typeId)).map(r => ({
        source: r.sourceId,
        target: r.targetId,
        lineStyle: { color: r.color || '#5470c6', width: Math.max(1.5, r.strength / 25) },
        value: r.strength,
        label: { show: false, formatter: r.typeName || r.description || '' }
      }));

      // 图例更新
      updateLegend(_allRelations);

      // 用 merge 模式更新数据（不破坏力导向模拟）
      // force 布局必须用 merge，否则力模拟会丢失导致白屏
      try {
        chart.setOption({
          series: [{
            data: nodes,
            links: links,
            animation: true,
            animationDuration: 500,
            animationEasingUpdate: 'cubicOut'
          }]
        });
      } catch(err) {
        console.error('renderGraph setOption error:', err);
        // fallback: 完全重建图表
        try {
          chart.dispose();
          initGraph();
          chart.setOption({
            series: [{ data: nodes, links: links }]
          });
        } catch(e2) {
          console.error('fallback init also failed:', e2);
        }
      }

      // 延迟一次 resize 确保渲染完成后的布局正确
      setTimeout(() => { if (chart) chart.resize(); }, 100);
    }

    function updateLegend(relations) {
      const container = document.getElementById('legendItems');
      if (!container) return;
      const typeMap = {};
      relations.forEach(r => {
        const key = r.typeName || r.description || '未知';
        if (!typeMap[key]) typeMap[key] = { name: key, color: r.color || '#5470c6', count: 0 };
        typeMap[key].count++;
      });
      const entries = Object.values(typeMap);
      if (entries.length === 0) {
        container.innerHTML = `<p class="text-muted text-sm">暂无关系</p>`;
        return;
      }
      container.innerHTML = entries.map(e =>
        `<div class="legend-item"><span class="legend-color" style="background:${e.color};"></span><span>${e.name}</span><span class="text-muted text-sm" style="margin-left:auto;">${e.count}</span></div>`
      ).join('');
    }

    // 点击节点显示详情
    function showCharacterInfo(data) {
      const char = _allCharacters.find(c => (c.$id || c.id) === data.id);
      const panel = document.getElementById('characterInfo');

      // 头像
      const avatarEl = document.getElementById('infoAvatar');
      if (avatarEl) avatarEl.src = `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(data.name)}`;

      document.getElementById('infoName').textContent = data.name;
      document.getElementById('infoMeta').textContent = data.role || '';

      // 计算真实关系数
      const sourceRels = _allRelations.filter(r => r.sourceId === data.id);
      const targetRels = _allRelations.filter(r => r.targetId === data.id);
      const total = sourceRels.length + targetRels.length;

      document.getElementById('infoDesc').textContent = char ? (char.description || '暂无简介...') : `点击查看 ${data.name} 的详细信息`;
      document.getElementById('infoRelations').textContent = total;

      // 简单分类：根据颜色判断友好/敌对（偏蓝绿=友好，偏红=敌对）
      let friends = 0, enemies = 0;
      [...sourceRels, ...targetRels].forEach(r => {
        const c = (r.color || '#5470c6').toLowerCase();
        if (c.includes('ff') && parseInt(c.slice(1,3), 16) > 180) enemies++;
        else friends++;
      });
      document.getElementById('infoFriends').textContent = friends;
      document.getElementById('infoEnemies').textContent = enemies;

      // 查看详情链接
      const linkEl = document.getElementById('infoLink');
      if (linkEl) linkEl.href = `characters.html?charId=${data.id}`;

      panel.classList.add('active');
    }

    // 聚焦到某个节点
    function focusNode(nodeId) {
      if (!chart) return;
      chart.dispatchAction({ type: 'highlight', seriesIndex: 0, name: nodeId });
    }

    // ==================== 工具栏操作 ====================
    function zoomIn() {
      if (!chart) return;
      _chartZoom = Math.min(_chartZoom * 1.3, 5);
      // ECharts roam 模式下用 dispatchAction 不太好控制精确缩放，改用 setOption 的 zoom
      // 用 roam 自带的滚轮缩放更自然，这里做辅助提示
      showNotification(`当前放大: ${Math.round(_chartZoom * 100)}%`, 'info');
    }

    function zoomOut() {
      if (!chart) return;
      _chartZoom = Math.max(_chartZoom / 1.3, 0.2);
      showNotification(`当前缩小: ${Math.round(_chartZoom * 100)}%`, 'info');
    }

    function resetZoom() {
      if (!chart) return;
      _chartZoom = 1;
      chart.dispatchAction({ type: 'restore' });
    }

    function downloadGraph() {
      if (!chart) return;
      const url = chart.getDataURL({ type: 'png', pixelRatio: 2, backgroundColor: '#fff' });
      const link = document.createElement('a');
      link.download = 'OC宇宙-关系图谱.png';
      link.href = url;
      link.click();
    }

    function changeLayout(type) {
      if (!chart) return;
      chart.setOption({ series: [{ layout: type }] }, true);
    }

    function updateGraph() {
      renderGraph();
    }

    function toggleCharacter(el, id) {
      el.classList.toggle('selected');
      updateGraph();
    }

    // ==================== 通用工具 ====================
    function closeModal(id) {
      const el = document.getElementById(id);
      if (el) el.classList.remove('active');
    }

    // 通知（兼容 app.js 防死循环）
    const _nativeNotify = typeof window.showNotification === 'function' ? window.showNotification : null;
    function showNotification(msg, type) {
      if (_nativeNotify && _nativeNotify !== showNotification) { _nativeNotify(msg, type); return; }
      let toast = document.getElementById('_relToast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = '_relToast';
        toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:8px;z-index:99999;font-size:0.9rem;transition:opacity .3s;opacity:0;pointer-events:none;';
        document.body.appendChild(toast);
      }
      const colors = { success:'#059669', error:'#dc2626', warning:'#d97706', info:'#2563eb' };
      toast.style.background = colors[type] || colors.info;
      toast.style.color = '#fff';
      toast.textContent = msg;
      toast.style.opacity = '1';
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => { toast.style.opacity = '0'; }, 3000);
    }
  </script>
</body>
