<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>写作编辑器 - OC宇宙</title>

  <!-- 主题初始化（必须最靠前） -->
  <script>
    try { var t = localStorage.getItem('oc_theme') || 'light'; document.documentElement.setAttribute('data-theme', t); } catch(e) {}
  </script>

  <!-- 关键主题色 & 暗色变量 -->
  <style>
    html, body { background-color: #FFFFFF; }
    html[data-theme="dark"], html[data-theme="dark"] body { background-color: #070B14; }
    html[data-theme="dark"] {
      --primary-color: #60A5FA; --primary-hover: #93C5FD;
      --bg-primary: #070B14; --bg-secondary: #0D1424;
      --bg-tertiary: #111827; --bg-card: #0D1424;
      --text-primary: #E2E8F0; --text-secondary: #94A3B8;
      --text-muted: #64748B; --border-color: #1E2D4A;
      --border-light: #243354; --editor-bg: #0D1424;
      --editor-text: #E2E8F0; --toolbar-bg: #0D1424;
      --toolbar-border: #1E2D4A; --statusbar-bg: #090E1A;
      --chapter-active-bg: #172554; --chapter-hover-bg: #111827;
      --focus-bg: #0D1117;
    }
  </style>

  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dark-mode.css">
  <link rel="stylesheet" href="../css/writer.css">

  <!-- Google Fonts + Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Appwrite Web SDK -->
  <script defer src="https://cdn.jsdelivr.net/npm/appwrite@17/dist/iife/sdk.min.js"></script>
</head>
<body class="writer-page">

  <!-- ==================== 顶部导航栏 ==================== -->
  <nav class="writer-navbar">
    <a href="stories.html" class="nav-back" title="返回故事列表">
      <i data-lucide="ArrowLeft" style="width:18px;height:18px;"></i>
      <span>返回</span>
    </a>

    <div class="nav-title-group">
      <input type="text" id="navTitleInput"
             class="nav-title-input"
             placeholder="未命名故事..."
             maxlength="100">
      <span class="nav-status-tag tag-warning" id="navStatusTag">草稿</span>
    </div>

    <div class="nav-actions">
      <!-- 信息面板浮窗按钮（平板端显示） -->
      <button class="btn-icon-nav info-toggle-float" onclick="toggleInfoFloat()" title="信息面板">
        <i data-lucide="BarChart3" style="width:16px;height:16px;"></i>
      </button>

      <!-- 专注模式切换 -->
      <button class="btn-icon-nav" id="focusModeBtn" onclick="toggleFocusMode()" title="进入专注写作 (F11)">
        <i data-lucide="Focus" style="width:16px;height:16px;"></i>
      </button>

      <!-- 主题切换 -->
      <button class="btn-icon-nav" id="themeToggleWriter" title="切换主题" onclick="toggleWriterTheme()">
        <i data-lucide="Moon" class="icon-moon"></i>
        <i data-lucide="Sun" class="icon-sun" style="display:none;"></i>
      </button>

      <!-- 保存状态 -->
      <div class="save-indicator status-saved" id="saveIndicator">
        <span class="save-dot"></span> 已保存
      </div>
    </div>
  </nav>


  <!-- ==================== 三栏主布局 ==================== -->
  <div class="writer-layout">

    <!-- ===== 左侧：章节管理面板 ===== -->
    <aside class="writer-sidebar-left" id="chapterPanel">
      <div class="panel-header">
        <h3><i data-lucide="BookOpen" style="width:15px;height:15px;display:inline;vertical-align:-2px;margin-right:5px;"></i> 章节列表</h3>
        <button class="btn-new-chapter" onclick="showChapterModal()">
          <i data-lucide="Plus" style="width:13px;height:13px;"></i> 新建
        </button>
      </div>
      <div class="chapter-tree" id="chapterTree">
        <!-- 动态渲染 -->
        <div class="editor-loading" style="padding:40px 20px;">
          <div class="loading-spinner"></div>
          <span style="margin-left:8px;">加载中...</span>
        </div>
      </div>
    </aside>


    <!-- ===== 中间：编辑器区域 ===== -->
    <main class="writer-editor-area">

      <!-- 格式工具栏 -->
      <div class="editor-toolbar" id="editorToolbar">
        <!-- 标题级别 -->
        <div class="toolbar-group">
          <select class="toolbar-select" data-cmd="formatBlock" title="标题样式">
            <option value="">正文</option>
            <option value="H1">一级标题</option>
            <option value="H2">二级标题</option>
            <option value="H3">三级标题</option>
          </select>
        </div>

        <!-- 文本格式 -->
        <div class="toolbar-group">
          <button class="toolbar-btn" data-cmd="bold" title="粗体 (Ctrl+B)">
            <i data-lucide="Bold"></i>
          </button>
          <button class="toolbar-btn" data-cmd="italic" title="斜体 (Ctrl+I)">
            <i data-lucide="Italic"></i>
          </button>
          <button class="toolbar-btn" data-cmd="underline" title="下划线 (Ctrl+U)">
            <i data-lucide="Underline"></i>
          </button>
          <button class="toolbar-btn" data-cmd="strikeThrough" title="删除线">
            <i data-lucide="Strikethrough"></i>
          </button>
        </div>

        <!-- 对齐方式 -->
        <div class="toolbar-group">
          <button class="toolbar-btn" data-cmd="justifyLeft" title="左对齐">
            <i data-lucide="AlignLeft"></i>
          </button>
          <button class="toolbar-btn" data-cmd="justifyCenter" title="居中">
            <i data-lucide="AlignCenter"></i>
          </button>
          <button class="toolbar-btn" data-cmd="justifyRight" title="右对齐">
            <i data-lucide="AlignRight"></i>
          </button>
        </div>

        <!-- 列表 & 引用 -->
        <div class="toolbar-group">
          <button class="toolbar-btn" data-cmd="insertUnorderedList" title="无序列表">
            <i data-lucide="List"></i>
          </button>
          <button class="toolbar-btn" data-cmd="insertOrderedList" title="有序列表">
            <i data-lucide="ListOrdered"></i>
          </button>
          <button class="toolbar-btn" data-cmd="formatBlock" data-value="BLOCKQUOTE" title="引用块">
            <i data-lucide="Quote"></i>
          </button>
          <button class="toolbar-btn" data-cmd="insertHorizontalRule" title="分隔线">
            <i data-lucide="Minus"></i>
          </button>
        </div>

        <!-- 撤销/重做 -->
        <div class="toolbar-group" style="border:none;">
          <button class="toolbar-btn" data-cmd="undo" title="撤销 (Ctrl+Z)">
            <i data-lucide="Undo2"></i>
          </button>
          <button class="toolbar-btn" data-cmd="redo" title="重做 (Ctrl+Y)">
            <i data-lucide="Redo2"></i>
          </button>
        </div>
      </div>

      <!-- 编辑器正文区 -->
      <div class="editor-wrapper" id="editorWrapper">
        <div class="editor-content"
             id="editor"
             contenteditable="true"
             data-placeholder="开始写下你的故事..."></div>
      </div>

      <!-- 底部状态栏 -->
      <div class="editor-statusbar" id="statusBar">
        <div class="statusbar-left">
          <span class="statusbar-item" id="statusbarWordCount">0 字</span>
          <span class="statusbar-item" id="statusbarTotalWords">总 0 字</span>
        </div>
        <div class="statusbar-center">
          <div class="progress-bar-container">
            <span>目标:</span>
            <div class="progress-bar-track">
              <div class="progress-bar-fill" id="progressBarFill" style="width:0%"></div>
            </div>
            <span id="progressText">0%</span>
          </div>
        </div>
        <div class="statusbar-right">
          <span class="save-indicator" id="saveIndicatorBottom"></span>
        </div>
      </div>
    </main>


    <!-- ===== 右侧：信息面板 ===== -->
    <aside class="writer-sidebar-right" id="infoPanel">
      <div class="info-tabs">
        <button class="info-tab active" data-tab="stats" onclick="switchInfoTab('stats')">
          <i data-lucide="BarChart3"></i> 统计
        </button>
        <button class="info-tab" data-tab="settings" onclick="switchInfoTab('settings')">
          <i data-lucide="Settings2"></i> 设置
        </button>
        <button class="info-tab" data-tab="characters" onclick="switchInfoTab('characters')">
          <i data-lucide="Users"></i> 角色
        </button>
      </div>
      <div class="info-content" id="infoContent">
        <!-- 动态渲染 -->
      </div>
    </aside>

  </div><!-- /writer-layout -->


  <!-- ==================== 新建/编辑章节模态框 ==================== -->
  <div class="modal-overlay-writer" id="chapterModal">
    <div class="modal-box-writer" onclick="event.stopPropagation()">
      <h3>
        <i data-lucide="FilePlus" style="width:18px;height:18px;display:inline;vertical-align:-3px;margin-right:6px;"></i>
        <span id="chapterModalTitle">新建章节</span>
      </h3>
      <form id="chapterForm" onsubmit="event.preventDefault(); submitChapterForm();">
        <div class="form-field">
          <label>名称</label>
          <input type="text" id="chTitleInput" placeholder="输入章节或卷的名称..." required maxlength="80" autocomplete="off">
        </div>
        <div class="form-field">
          <label>类型</label>
          <select id="chTypeSelect">
            <option value="chapter">章节</option>
            <option value="volume">卷（分卷）</option>
          </select>
        </div>
        <p style="font-size:0.78rem;color:var(--text-muted);margin-bottom:12px;" id="volLabelHint">
          根级创建（可设为卷）
        </p>
        <div class="modal-footer-btns">
          <button type="button" class="btn btn-secondary" onclick="closeModal_w()" style="padding:8px 20px;">取消</button>
          <button type="submit" class="btn btn-primary" style="padding:8px 20px;">
            <i data-lucide="Check" style="width:15px;height:15px;"></i> 创建
          </button>
        </div>
      </form>
    </div>
  </div>


  <!-- ==================== 平板端：信息面板浮窗 ==================== -->
  <div class="info-panel-float" id="infoPanelFloat">
    <div class="info-tabs">
      <button class="info-tab active" data-tab="stats" onclick="switchInfoTab('stats')">
        <i data-lucide="BarChart3"></i> 统计
      </button>
      <button class="info-tab" data-tab="settings" onclick="switchInfoTab('settings')">
        <i data-lucide="Settings2"></i> 设置
      </button>
      <button class="info-tab" data-tab="characters" onclick="switchInfoTab('characters')">
        <i data-lucide="Users"></i> 角色
      </button>
      <button class="info-tab" style="flex:none;padding:0 8px;" onclick="toggleInfoFloat()" title="关闭">
        <i data-lucide="X" style="width:14px;height:14px;"></i>
      </button>
    </div>
    <div class="info-content" id="infoContentFloat"></div>
  </div>


  <!-- ==================== 移动端：章节抽屉 ==================== -->
  <div class="drawer-overlay" id="drawerOverlay" onclick="closeChapterDrawer()"></div>
  <div class="chapter-drawer" id="chapterDrawer">
    <div class="chapter-drawer-handle" onmousedown="">
      <div class="drawer-bar"></div>
    </div>
    <div class="chapter-drawer-body" id="chapterDrawerBody">
      <!-- 复制左侧章节树内容到这里 -->
    </div>
    <div style="padding:10px 14px;border-top:1px solid var(--border-color);">
      <button class="btn-new-chapter" onclick="showChapterModal(); closeChapterDrawer();" style="width:100%;justify-content:center;">
        <i data-lucide="Plus" style="width:13px;height:13px;"></i> 新建章节
      </button>
    </div>
  </div>

  <!-- 移动端：章节触发器 -->
  <button class="mobile-chapter-trigger" id="mobileChapterTrigger" onclick="openChapterDrawer()">
    <i data-lucide="BookOpen" style="width:15px;height:15px;"></i> 章节
  </button>


  <!-- ==================== 专注模式退出提示 ==================== -->
  <div class="focus-exit-hint" id="focusExitHint" style="display:none" onclick="toggleFocusMode()">
    <i data-lucide="X" style="width:13px;height:13px;"></i>
    按 <kbd>Esc</kbd> 退出专注模式
  </div>


  <!-- ==================== JavaScript ==================== -->
  <script src="../js/app.js"></script>
  <script src="../js/appwrite.js"></script>
  <script src="../js/api-client.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/writer.js"></script>
  <script>
    // 页面初始化
    document.addEventListener('DOMContentLoaded', async function() {
      initTheme();
      await OCData.initDataMode();
      await initWriter();
      
      // Lucide 图标（多次确保渲染）
      [50, 200, 500].forEach(delay => {
        setTimeout(() => { try { if (window.lucide) lucide.createIcons(); } catch(e) {} }, delay);
      });
    });

    // 编辑器主题内切换
    function toggleWriterTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('oc_theme', next);

      // 更新图标
      const moonIcon = document.querySelector('#themeToggleWriter .icon-moon');
      const sunIcon = document.querySelector('#themeToggleWriter .icon-sun');
      if (moonIcon && sunIcon) {
        moonIcon.style.display = next === 'dark' ? 'none' : '';
        sunIcon.style.display = next === 'dark' ? '' : 'none';
      }

      showToast(next === 'dark' ? '已切换到暗色' : '已切换到浅色', 'info');
    }

    // 初始化主题图标状态
    (function initThemeIcon() {
      const isDark = localStorage.getItem('oc_theme') === 'dark';
      const moonIcon = document.querySelector('#themeToggleWriter .icon-moon');
      const sunIcon = document.querySelector('#themeToggleWriter .icon-sun');
      if (moonIcon && sunIcon) {
        moonIcon.style.display = isDark ? 'none' : '';
        sunIcon.style.display = isDark ? '' : 'none';
      }
    })();
  </script>
</body>
</html>
